<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智文比对 - 电商主图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        .banner {
            width: 800px;
            height: 800px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        /* 装饰圆形 */
        .circle1 {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            top: -100px;
            right: -100px;
        }
        .circle2 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            bottom: -80px;
            left: -80px;
        }
        
        /* 主标题区 */
        .main-title {
            text-align: center;
            padding-top: 60px;
        }
        .main-title h1 {
            font-size: 72px;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            letter-spacing: 8px;
        }
        .subtitle {
            font-size: 24px;
            color: rgba(255,255,255,0.9);
            margin-top: 15px;
            letter-spacing: 4px;
        }
        
        /* 核心卖点 */
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
            padding: 0 40px;
        }
        .feature-item {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            width: 160px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .feature-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .feature-text {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }
        
        /* 精度展示 */
        .accuracy {
            text-align: center;
            margin-top: 50px;
        }
        .accuracy-number {
            font-size: 120px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            line-height: 1;
        }
        .accuracy-label {
            font-size: 28px;
            color: rgba(255,255,255,0.9);
            margin-top: 5px;
        }
        
        /* 底部标语 */
        .tagline {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            text-align: center;
        }
        .tagline-main {
            font-size: 32px;
            color: #fff;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .tagline-sub {
            display: inline-block;
            background: #fff;
            color: #764ba2;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: 600;
        }
        
        /* 格式标签 */
        .formats {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            gap: 10px;
        }
        .format-tag {
            background: rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- 装饰元素 -->
        <div class="circle1"></div>
        <div class="circle2"></div>
        
        <!-- 格式支持标签 -->
        <div class="formats">
            <span class="format-tag">📄 Word</span>
            <span class="format-tag">📑 PDF</span>
            <span class="format-tag">📝 TXT</span>
        </div>
        
        <!-- 主标题 -->
        <div class="main-title">
            <h1>智文比对</h1>
            <p class="subtitle">专业文档相似度检测工具</p>
        </div>
        
        <!-- 核心卖点 -->
        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">🔍</div>
                <div class="feature-text">智能分析</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🖼️</div>
                <div class="feature-text">图文双检</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">批量处理</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">隐私安全</div>
            </div>
        </div>
        
        <!-- 精度展示 -->
        <div class="accuracy">
            <div class="accuracy-number">95%+</div>
            <div class="accuracy-label">检测精度</div>
        </div>
        
        <!-- 底部标语 -->
        <div class="tagline">
            <div class="tagline-main">告别人工比对 · AI智能审核</div>
            <span class="tagline-sub">本地运行 数据安全</span>
        </div>
    </div>
</body>
</html>
