name: "publish"

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon M1/M2/M3)
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
            name: "macOS-ARM64"
          
          # macOS x86_64 (Intel)
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
            name: "macOS-Intel"
          
          # Windows x64
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            rust_target: "x86_64-pc-windows-msvc"
            name: "Windows-x64"
          
          # Windows ARM64
          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"
            rust_target: "aarch64-pc-windows-msvc"
            name: "Windows-ARM64"
          
          # Linux x64
          - platform: "ubuntu-24.04"
            args: "--target x86_64-unknown-linux-gnu"
            rust_target: "x86_64-unknown-linux-gnu"
            name: "Linux-x64"
          
          # Linux ARM64
          - platform: "ubuntu-24.04-arm"
            args: "--target aarch64-unknown-linux-gnu"
            rust_target: "aarch64-unknown-linux-gnu"
            name: "Linux-ARM64"

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})
    
    steps:
      - uses: actions/checkout@v6.0.0

      - name: Install pnpm + deps
        uses: pnpm/action-setup@v4.2.0
        with:
          version: 10
          run_install: true

      - name: Use Node.js
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies (Ubuntu x64)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies (Ubuntu ARM64)
        if: matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@action-v0.5.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: |
            ## 下载说明
            
            | 平台 | 架构 | 文件 |
            |------|------|------|
            | Windows | x64 | `.msi` / `.exe` |
            | Windows | ARM64 | `.msi` / `.exe` |
            | macOS | Apple Silicon (M1/M2/M3) | `.dmg` (aarch64) |
            | macOS | Intel | `.dmg` (x86_64) |
            | Linux | x64 | `.deb` / `.AppImage` |
            | Linux | ARM64 | `.deb` / `.AppImage` |
            
            **注意**: macOS 版本未签名，首次运行请在终端执行：
            ```bash
            xattr -c /Applications/智文比对.app
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
